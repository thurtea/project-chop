  <main id="main" class="page">
    <h1>Request a demo</h1>
    <p>Leave a name and an email. A Windows build goes out when one is ready to send.</p>
    <p id="demo-status" hidden></p>
    <form class="demo-form" action="demo.php" method="post">
      <label>Name
        <input type="text" name="name" maxlength="80" autocomplete="name" required>
      </label>
      <label>Email
        <input type="email" name="email" maxlength="120" autocomplete="email" required>
      </label>
      <label>Note
        <textarea name="note" maxlength="1000" rows="5"></textarea>
      </label>
      <label class="trap">Company
        <input type="text" name="company" tabindex="-1" autocomplete="off">
      </label>
      <button type="submit">Send request</button>
    </form>
  </main>

  <footer>
